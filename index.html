<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- SEO & Metadata -->
    <title>Hadi &amp; Regita - Wedding Invitation</title>
    <meta name="description" content="The Wedding of Hadi &amp; Regita - Invitation">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="is-locked">

    <main class="invitation-container">
        
        <!-- SECTION 1: COVER UTAMA -->
        <section id="section-cover" class="cover-section">
            <div class="cover-content">
                
                <!-- Gambar Utama Cover -->
                <div class="cover-image-wrapper">
                    <img src="https://bycativestudio.com/wp-content/uploads/2026/06/Cover-Sketch-Navy-Hadi-Regita-812x1024.png" 
                         alt="Welcome to The Wedding of Hadi and Regita" 
                         class="cover-img">
                </div>

                <!-- Informasi Tamu Undangan -->
                <div class="guest-info">
                    <p class="guest-label">Yth: Bpk/Ibu/Saudara/i</p>
                    <h2 class="guest-name">Nama Tamu</h2>
                    
                    <!-- Tombol Buka Undangan -->
                    <div id="tombol-buka" class="button-wrapper">
                        <a href="#buka" class="btn-open">
                            <i class="far fa-envelope-open"></i>
                            <span>Open Invitation</span>
                        </a>
                    </div>
                </div>

                <!-- Banner/Tanggal di Bawah Cover -->
                <div class="cover-footer-wrapper">
                    <img src="https://bycativestudio.com/wp-content/uploads/2026/06/IMG_8386-1-1024x246.png" 
                         alt="21 September 2025" 
                         class="footer-img">
                </div>

            </div>
        </section>

        <!-- SECTION 2: ISI UNDANGAN / VIDEO -->
        <section id="buka" class="content-section">
            <div class="video-container">
                <video id="wedding-video" class="elementor-video" 
                       src="https://bycativestudio.com/wp-content/uploads/2026/06/Hadi-Regita.mp4" 
                       loop muted playsinline controlslist="nodownload"></video>
            </div>
        </section>

    </main>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
